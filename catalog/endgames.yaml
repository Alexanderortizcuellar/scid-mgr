    side_a:
      rooks: 1
      pawns: 3
    side_b:
      rooks: 1
      pawns: 2
    references:
    - FCE Chapter 6
    - Dvoretsky Chapter 4
    - 'de la Villa #29-33'
  - id: END_ROOK_R4P_R3P
    bit: 11
    name: Rook and 4 Pawns vs Rook and 3 Pawns
    short_name: R+4P vs R+3P
    gbr_code: '0400.43'
    description: Most frequent rook ending in grandmaster practice (4 vs 3 on one
