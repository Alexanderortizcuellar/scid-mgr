      rooks: 1
      pawns: 2
    side_b:
      rooks: 1
      pawns: 0
    references:
    - FCE Chapter 6
    - 'de la Villa #25-28'
  - id: END_ROOK_R2P_RP
    bit: 9
    name: Rook and 2 Pawns vs Rook and Pawn
    short_name: R+2P vs R+P
    gbr_code: '0400.21'
