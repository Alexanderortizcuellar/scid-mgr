      rooks: 1
      pawns: 2
    side_b:
      rooks: 1
      pawns: 1
    references:
    - FCE Chapter 6
    - Dvoretsky Chapter 4
  - id: END_ROOK_R3P_R2P
    bit: 10
    name: Rook and 3 Pawns vs Rook and 2 Pawns
    short_name: R+3P vs R+2P
    gbr_code: '0400.32'
    description: Classic 3 vs 2 rook ending on one flank; defensive setups and creating
