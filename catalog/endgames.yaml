# ==============================================================================
# Chess Feature Catalog — Endgame Taxonomy v2.0
# Managed via Chess Scanner Endgame Catalog GUI
# ==============================================================================

schema_version: '2.0'
family: ENDGAME
match_mode: exact_material
categories:
- id: PAWN
  name: Pawn Endgames
  description: Positions where only kings and pawns remain on the board.
  features:
  - id: END_PAWN_KP_K
    bit: 0
    name: King and Pawn vs King
    short_name: K+P vs K
    gbr_code: '0000.10'
    description: Single pawn race and opposition battle against a bare king. Governed
      by key squares and the square rule.
    side_a:
      pawns: 1
    side_b:
      pawns: 0
    references:
    - FCE Chapter 2
    - Dvoretsky Chapter 1
    - 'de la Villa #1-6'
  - id: END_PAWN_KP_KP
    bit: 1
    name: King and Pawn vs King and Pawn
    short_name: K+P vs K+P
    gbr_code: '0000.11'
    description: Single pawn on each side; critical square opposition, Trebuchet position,
      and reciprocal zugzwang.
    side_a:
      pawns: 1
    side_b:
      pawns: 1
    references:
    - FCE Chapter 2
    - Dvoretsky Chapter 1
  - id: END_PAWN_K2P_K
    bit: 2
    name: King and 2 Pawns vs King
    short_name: K+2P vs K
    gbr_code: '0000.20'
    description: Two pawns against a bare king; connected or doubled pawn winning
      technique.
    side_a:
      pawns: 2
    side_b:
      pawns: 0
    references:
    - FCE Chapter 2
  - id: END_PAWN_K2P_KP
    bit: 3
    name: King and 2 Pawns vs King and Pawn
    short_name: K+2P vs K+P
    gbr_code: '0000.21'
    description: 2 vs 1 pawn ending; creating an outside passed pawn or trading down.
    side_a:
      pawns: 2
    side_b:
      pawns: 1
    references:
    - FCE Chapter 2
    - 'de la Villa #7-10'
  - id: END_PAWN_MULTI
    bit: 4
    name: Multi-Pawn Endgame
    short_name: K+Pawns vs K+Pawns
    gbr_code: '0000'
    description: Pure pawn endings with 2 or more pawns on both sides; breakthrough
      races, outside passed pawns, and triangulation.
    side_a:
      pawns:
        min: 2
        max: 8
    side_b:
      pawns:
        min: 2
        max: 8
    references:
    - FCE Chapter 2
    - Dvoretsky Chapter 1
- id: ROOK
  name: Rook Endgames
  description: Positions with one or two rooks per side and optional pawns (~50% of
    practical tournament endgames).
  features:
  - id: END_ROOK_R_R
    bit: 5
    name: Bare Rooks
    short_name: R vs R
    gbr_code: '0400.00'
    description: Lone rook vs lone rook without pawns (immediate theoretical draw).
    side_a:
      rooks: 1
      pawns: 0
    side_b:
      rooks: 1
      pawns: 0
    references:
    - FCE Chapter 6
  - id: END_ROOK_RP_R
    bit: 6
    name: Rook and Pawn vs Rook
    short_name: R+P vs R
    gbr_code: '0300.10'
    description: Fundamental rook ending featuring the Lucena bridge-building technique,
      Philidor 3rd-rank defense, and short-side defense.
    side_a:
      rooks: 1
      pawns: 1
    side_b:
      rooks: 1
      pawns: 0
    references:
    - FCE Chapter 6
    - Dvoretsky Chapter 4
    - 'de la Villa #16-24'
  - id: END_ROOK_RP_RP
    bit: 7
    name: Rook and Pawn vs Rook and Pawn
    short_name: R+P vs R+P
    gbr_code: '0400.11'
    description: Symmetrical pawn count rook ending; passed pawn vs passed pawn or
      rook cut-off tactics.
    side_a:
      rooks: 1
      pawns: 1
    side_b:
      rooks: 1
      pawns: 1
    references:
    - FCE Chapter 6
    - Dvoretsky Chapter 4
  - id: END_ROOK_R2P_R
    bit: 8
    name: Rook and 2 Pawns vs Rook
    short_name: R+2P vs R
    gbr_code: '0300.20'
    description: Rook and 2 pawns vs lone rook; connected pawns, isolated pawns, and
      rook vs f+h pawns.
