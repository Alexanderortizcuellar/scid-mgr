[package]
name = "cql-lang"
version = "0.1.0"
edition = "2021"
description = "Pure Chess Query Language (CQL) AST, parser, evaluator, and transformation engine"

[dependencies]
shakmaty = { version = "0.27", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
log = "0.4"
thiserror = "1.0"
